# =============================================================================
# inventory.yaml - Input for Automation/auto_provision.py (Member 4)
# -----------------------------------------------------------------------------
# NO usernames or passwords here. Credentials come from environment variables
# (TVI_SSH_USERNAME, TVI_SSH_PASSWORD, TVI_ENABLE_SECRET, TVI_ADMIN_SECRET) or getpass.
#
# devices:  one entry per device
#     hostname     project naming convention, also used in backup file names
#     ip           management address reachable from AUTO-NODE01 (192.168.1.50)
#     port         SSH port (default 22)
#     device_type  Netmiko type (cisco_ios for vIOS / vIOS-L2)
#     site         HCMC | HANOI | DANANG   (used by --site and by vlans.sites)
#     role         core    -> L2 checks + HSRP + DHCP relay check, gets VLANs
#                  access  -> L2 checks, gets VLANs
#                  router  -> routing checks (OSPF / BGP), no VLANs
#     fhrp         hsrp | vrrp (core only, default hsrp)
#
# baseline: values pushed by --push (all optional, defaults are in the script)
# vlans:    the VLAN payload. `sites` is optional: leave it out to create the VLAN
#           on every switch, or list the sites that need it.
#
# Router IPs are the Loopback0 addresses (reachable once routing is up).
# ACL-VTY on the routers accepts SSH only from 192.168.0.0/22 and 10.x.0.x, which
# includes AUTO-NODE01. HQ routers answer only when the HQ switches are configured.
# ISP-A / ISP-B are not listed: the lab hosts cannot reach them and they are not TVI devices.
# =============================================================================

baseline:
  admin_user: admin
  ntp_servers:
    - 10.10.10.50
  syslog_hosts:
    - 10.10.10.51
  banner: "Unauthorized access to TVI Corporate Infrastructure is prohibited."
  aaa: true

vlans:
  - {id: 10, name: EXEC_FINANCE,    sites: [HCMC]}
  - {id: 20, name: RND_ENGINEERING, sites: [HANOI]}
  - {id: 30, name: LOGISTICS_OPS,   sites: [DANANG]}
  - {id: 99, name: MANAGEMENT}

devices:
  # ----- HQ - Ho Chi Minh City -----
  - hostname: HCMC-CORE-SW01
    ip: 192.168.1.10
    port: 22
    device_type: cisco_ios
    site: HCMC
    role: core
    fhrp: hsrp

  - hostname: HCMC-CORE-SW02
    ip: 192.168.1.11
    port: 22
    device_type: cisco_ios
    site: HCMC
    role: core
    fhrp: hsrp

  - hostname: HCMC-ACC-SW01
    ip: 192.168.1.21
    port: 22
    device_type: cisco_ios
    site: HCMC
    role: access

  - hostname: HCMC-ACC-SW02
    ip: 192.168.1.22
    port: 22
    device_type: cisco_ios
    site: HCMC
    role: access

  - hostname: HCMC-EDGE-RTR01
    ip: 10.10.0.1
    port: 22
    device_type: cisco_ios
    site: HCMC
    role: router

  - hostname: HCMC-EDGE-RTR02
    ip: 10.10.0.2
    port: 22
    device_type: cisco_ios
    site: HCMC
    role: router

  # ----- Hanoi - R&D -----
  - hostname: HANOI-RND-RTR01
    ip: 10.20.0.1
    port: 22
    device_type: cisco_ios
    site: HANOI
    role: router

  - hostname: HANOI-RND-SW01
    ip: 192.168.2.10
    port: 22
    device_type: cisco_ios
    site: HANOI
    role: access

  - hostname: HANOI-RND-SW02
    ip: 192.168.2.21
    port: 22
    device_type: cisco_ios
    site: HANOI
    role: access

  # ----- Da Nang - Logistics -----
  - hostname: DANANG-LOG-RTR01
    ip: 10.30.0.1
    port: 22
    device_type: cisco_ios
    site: DANANG
    role: router

  - hostname: DANANG-LOG-SW01
    ip: 192.168.3.10
    port: 22
    device_type: cisco_ios
    site: DANANG
    role: access
